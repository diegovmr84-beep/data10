<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- curva de velocidade de crescimento (pico central) -->
  <path d="M 260 620 C 470 600, 620 520, 760 320 C 830 220, 900 220, 970 320 C 1100 500, 1250 590, 1400 610"
        fill="none" stroke="#7686a8" stroke-opacity="0.45" stroke-width="3"/>

  <!-- linha tracejada marcando o pico (APHV) -->
  <line x1="865" y1="150" x2="865" y2="680" stroke="#e6eaf3" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="3 10"/>
  <circle cx="865" cy="270" r="9" fill="#e57426"/>

  <!-- grupo cronologico: pontos alinhados por idade, tamanhos misturados -->
  <g fill="#f4f6fa" fill-opacity="0.85">
    <circle cx="330" cy="740" r="11"/>
    <circle cx="410" cy="740" r="20"/>
    <circle cx="490" cy="740" r="14"/>
    <circle cx="570" cy="740" r="24"/>
    <circle cx="650" cy="740" r="12"/>
  </g>
  <text x="490" y="800" text-anchor="middle" fill="#e6eaf3" fill-opacity="0.35" font-family="sans-serif" font-size="22" letter-spacing="1">idade cronológica</text>

  <!-- seta -->
  <path d="M 760 745 L 840 745" stroke="#e57426" stroke-opacity="0.5" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e57426" fill-opacity="0.5"/>
    </marker>
  </defs>

  <!-- grupo bio-banded: pontos reagrupados por tamanho semelhante -->
  <g fill="#e57426" fill-opacity="0.9">
    <circle cx="920" cy="740" r="13"/>
    <circle cx="1000" cy="740" r="14"/>
    <circle cx="1080" cy="740" r="13"/>
    <circle cx="1160" cy="740" r="15"/>
    <circle cx="1240" cy="740" r="13"/>
  </g>
  <text x="1080" y="800" text-anchor="middle" fill="#e6eaf3" fill-opacity="0.55" font-family="sans-serif" font-size="22" letter-spacing="1">maturação biológica</text>

  <ellipse cx="800" cy="450" rx="640" ry="430" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
