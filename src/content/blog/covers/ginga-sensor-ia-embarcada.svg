<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e57426" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e57426" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="800" font-family="Source Serif 4, Georgia, serif" font-size="300" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">16g</text>

  <!-- ondas irradiando do sensor -->
  <circle cx="800" cy="470" r="260" fill="url(#pulse)"/>
  <circle cx="800" cy="470" r="110" fill="none" stroke="#e57426" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="800" cy="470" r="180" fill="none" stroke="#e57426" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="800" cy="470" r="250" fill="none" stroke="#e57426" stroke-opacity="0.1" stroke-width="2"/>

  <!-- sensor central, pequeno chip com circuito -->
  <g transform="translate(800,470)">
    <rect x="-38" y="-38" width="76" height="76" rx="12" fill="#16223f" stroke="#e57426" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#e57426"/>
    <line x1="-38" y1="-15" x2="-50" y2="-15" stroke="#7686a8" stroke-width="3"/>
    <line x1="-38" y1="15" x2="-50" y2="15" stroke="#7686a8" stroke-width="3"/>
    <line x1="38" y1="-15" x2="50" y2="-15" stroke="#7686a8" stroke-width="3"/>
    <line x1="38" y1="15" x2="50" y2="15" stroke="#7686a8" stroke-width="3"/>
    <line x1="-15" y1="-38" x2="-15" y2="-50" stroke="#7686a8" stroke-width="3"/>
    <line x1="15" y1="-38" x2="15" y2="-50" stroke="#7686a8" stroke-width="3"/>
  </g>

  <!-- pontos de metrica ao redor -->
  <g fill="#f4f6fa">
    <circle cx="560" cy="330" r="7"/>
    <circle cx="1040" cy="330" r="7"/>
    <circle cx="540" cy="620" r="7"/>
    <circle cx="1060" cy="620" r="7"/>
    <circle cx="800" cy="230" r="7"/>
    <circle cx="800" cy="710" r="7"/>
  </g>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="300" height="46" rx="23" fill="#e57426"/>
    <text x="150" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">TECNOLOGIA E DADOS</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
