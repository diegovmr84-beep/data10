           L 810 400
           L 870 460
           L 920 560
           L 880 600
           L 810 500
           L 760 440
           L 700 560
           L 650 700
           L 600 680
           L 670 520
           L 720 420
           L 700 330
           L 650 300"
        fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- esqueleto de rastreamento por visao computacional, sobreposto -->
  <g stroke="#e57426" stroke-width="4" stroke-linecap="round">
    <line x1="795" y1="290" x2="810" y2="400"/>
    <line x1="810" y1="400" x2="870" y2="460"/>
    <line x1="810" y1="400" x2="700" y2="420"/>
    <line x1="810" y1="400" x2="760" y2="440"/>
    <line x1="760" y1="440" x2="700" y2="560"/>
    <line x1="700" y1="560" x2="650" y2="700"/>
    <line x1="810" y1="400" x2="880" y2="560"/>
    <line x1="880" y1="560" x2="920" y2="680"/>
  </g>
  <g fill="#e57426">
    <circle cx="795" cy="290" r="18"/>
    <circle cx="810" cy="400" r="9"/>
    <circle cx="700" cy="420" r="9"/>
    <circle cx="760" cy="440" r="9"/>
    <circle cx="700" cy="560" r="9"/>
    <circle cx="650" cy="700" r="9"/>
    <circle cx="880" cy="560" r="9"/>
    <circle cx="920" cy="680" r="9"/>
    <circle cx="870" cy="460" r="9"/>
  </g>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="320" height="46" rx="23" fill="#e57426"/>
    <text x="160" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">TECNOLOGIA E DADOS</text>
