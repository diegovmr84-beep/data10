  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="820" font-family="Source Serif 4, Georgia, serif" font-size="260" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">60s</text>

  <!-- silhueta de corredor em contorno -->
  <path d="M 760 260
