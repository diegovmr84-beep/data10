<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e57426" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e57426" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="760" cy="480" r="260" fill="url(#glow)"/>

  <!-- silhueta de jogador visto de costas, simplificada -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.55" stroke-width="4">
    <circle cx="760" cy="280" r="42"/>
    <path d="M 660 400 C 660 340 700 320 760 320 C 820 320 860 340 860 400 L 860 560 C 860 590 840 605 810 605 L 710 605 C 680 605 660 590 660 560 Z"/>
    <path d="M 660 420 L 590 560"/>
    <path d="M 860 420 L 930 560"/>
    <path d="M 710 605 L 695 740"/>
    <path d="M 810 605 L 825 740"/>
  </g>

  <!-- colete destacado -->
  <path d="M 680 390 L 840 390 L 850 560 C 850 580 830 595 810 595 L 710 595 C 690 595 670 580 670 560 Z" fill="#16223f" stroke="#e57426" stroke-width="3" stroke-opacity="0.9"/>

  <!-- pod do sensor, entre as escapulas -->
  <rect x="738" y="415" width="44" height="60" rx="8" fill="#e57426"/>

  <!-- linhas de chamada pros rotulos -->
  <line x1="782" y1="430" x2="980" y2="360" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="782" y1="455" x2="980" y2="470" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="760" y1="475" x2="560" y2="560" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="2"/>

  <!-- rotulos -->
  <g font-family="Inter, sans-serif" fill="#f4f6fa">
    <text x="990" y="350" font-size="22" font-weight="700">GPS</text>
    <text x="990" y="376" font-size="16" fill-opacity="0.6">10 Hz</text>

    <text x="990" y="460" font-size="22" font-weight="700">IMU</text>
    <text x="990" y="486" font-size="16" fill-opacity="0.6">100 Hz</text>

    <text x="420" y="555" font-size="20" font-weight="700" text-anchor="end">Pod do sensor</text>
    <text x="420" y="581" font-size="15" fill-opacity="0.6" text-anchor="end">60–80 g</text>
  </g>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="300" height="46" rx="23" fill="#e57426"/>
    <text x="150" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">TECNOLOGIA E DADOS</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
