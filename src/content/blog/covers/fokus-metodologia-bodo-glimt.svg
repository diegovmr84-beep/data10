<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- tres nos convergindo para um hub central -->
  <g stroke="#7686a8" stroke-opacity="0.45" stroke-width="2">
    <line x1="430" y1="280" x2="800" y2="450"/>
    <line x1="430" y1="450" x2="800" y2="450"/>
    <line x1="430" y1="620" x2="800" y2="450"/>
  </g>

  <!-- no 1: scouting (lupa) -->
  <g transform="translate(430,280)" fill="none" stroke="#f4f6fa" stroke-opacity="0.75" stroke-width="4">
    <circle r="34"/>
    <circle cx="-8" cy="-8" r="14"/>
    <line x1="2" y1="2" x2="16" y2="16"/>
  </g>

  <!-- no 2: planejamento de elenco (grade) -->
  <g transform="translate(430,450)" fill="none" stroke="#f4f6fa" stroke-opacity="0.75" stroke-width="4">
    <circle r="34"/>
    <rect x="-16" y="-16" width="32" height="32" rx="3"/>
    <line x1="-16" y1="0" x2="16" y2="0"/>
    <line x1="0" y1="-16" x2="0" y2="16"/>
  </g>

  <!-- no 3: financeiro (moeda) -->
  <g transform="translate(430,620)" fill="none" stroke="#f4f6fa" stroke-opacity="0.75" stroke-width="4">
    <circle r="34"/>
    <circle r="15"/>
    <line x1="0" y1="-9" x2="0" y2="9"/>
  </g>

  <!-- hub central, ranking por IA -->
  <circle cx="800" cy="450" r="76" fill="none" stroke="#e57426" stroke-width="5"/>
  <circle cx="800" cy="450" r="50" fill="#e57426" fill-opacity="0.15"/>
  <g transform="translate(800,450)" fill="#f4f6fa" fill-opacity="0.85">
    <circle cx="-20" cy="10" r="6"/>
    <circle cx="0" cy="-14" r="6"/>
    <circle cx="20" cy="10" r="6"/>
    <path d="M -20 10 L 0 -14 L 20 10" fill="none" stroke="#f4f6fa" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- seta de saida -->
  <g stroke="#e57426" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="900" y1="450" x2="1080" y2="450"/>
    <path d="M 1060 432 L 1084 450 L 1060 468"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
