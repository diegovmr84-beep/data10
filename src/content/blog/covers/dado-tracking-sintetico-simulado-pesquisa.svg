<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- "tela" de videogame a esquerda, com campo simplificado em pixel -->
  <rect x="330" y="270" width="420" height="360" rx="10" fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="3"/>
  <g fill="#7686a8" fill-opacity="0.55">
    <rect x="380" y="330" width="18" height="18"/>
    <rect x="460" y="360" width="18" height="18"/>
    <rect x="540" y="330" width="18" height="18"/>
    <rect x="420" y="450" width="18" height="18"/>
    <rect x="500" y="480" width="18" height="18"/>
    <rect x="580" y="440" width="18" height="18"/>
    <rect x="440" y="560" width="18" height="18"/>
    <rect x="560" y="560" width="18" height="18"/>
  </g>
  <circle cx="500" cy="420" r="10" fill="#e57426"/>

  <!-- seta de transformacao -->
  <path d="M 790 450 L 990 450" stroke="#e57426" stroke-opacity="0.55" stroke-width="3" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e57426" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- "planilha" de dado a direita -->
  <g>
    <rect x="1020" y="270" width="260" height="360" rx="10" fill="none" stroke="#f4f6fa" stroke-opacity="0.4" stroke-width="3"/>
    <g stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2">
      <line x1="1020" y1="330" x2="1280" y2="330"/>
      <line x1="1020" y1="380" x2="1280" y2="380"/>
      <line x1="1020" y1="430" x2="1280" y2="430"/>
      <line x1="1020" y1="480" x2="1280" y2="480"/>
      <line x1="1020" y1="530" x2="1280" y2="530"/>
      <line x1="1020" y1="580" x2="1280" y2="580"/>
      <line x1="1110" y1="270" x2="1110" y2="630"/>
      <line x1="1200" y1="270" x2="1200" y2="630"/>
    </g>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
