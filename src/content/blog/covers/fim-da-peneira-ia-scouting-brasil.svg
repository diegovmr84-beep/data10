<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- pontos espalhados representando talentos por todo o territorio -->
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="330" cy="260" r="7"/>
    <circle cx="260" cy="420" r="7"/>
    <circle cx="380" cy="560" r="7"/>
    <circle cx="300" cy="650" r="7"/>
    <circle cx="450" cy="320" r="7"/>
    <circle cx="420" cy="700" r="7"/>
  </g>

  <!-- linhas convergindo para um hub central -->
  <g stroke="#7686a8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="330" y1="260" x2="800" y2="450"/>
    <line x1="260" y1="420" x2="800" y2="450"/>
    <line x1="380" y1="560" x2="800" y2="450"/>
    <line x1="300" y1="650" x2="800" y2="450"/>
    <line x1="450" y1="320" x2="800" y2="450"/>
    <line x1="420" y1="700" x2="800" y2="450"/>
  </g>

  <!-- icone de tela/celular no centro -->
  <g transform="translate(800,450)" fill="none" stroke="#f4f6fa" stroke-opacity="0.8" stroke-width="4">
    <rect x="-55" y="-90" width="110" height="180" rx="14"/>
    <line x1="-25" y1="72" x2="25" y2="72" stroke-width="3"/>
  </g>
  <path d="M 780 410 L 795 430 L 825 385" fill="none" stroke="#e57426" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,20)"/>

  <!-- saida para clubes, dois nos a direita -->
  <g stroke="#e57426" stroke-opacity="0.5" stroke-width="2">
    <line x1="855" y1="420" x2="1080" y2="330"/>
    <line x1="855" y1="480" x2="1080" y2="560"/>
  </g>
  <g fill="none" stroke="#e57426" stroke-width="4">
    <circle cx="1110" cy="320" r="30"/>
    <circle cx="1110" cy="570" r="30"/>
  </g>

  <ellipse cx="800" cy="450" rx="620" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
