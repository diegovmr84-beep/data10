<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- auroras estilizadas, referencia ao artico -->
  <g fill="none" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round">
    <path d="M 150 180 Q 500 60 900 200 T 1500 160" stroke="#e57426"/>
    <path d="M 120 260 Q 520 140 940 280 T 1480 240" stroke="#7686a8"/>
  </g>

  <!-- dois circulos de tamanho desigual, referencia ao confronto Bayern x Glimt -->
  <circle cx="1080" cy="560" r="150" fill="none" stroke="#f4f6fa" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="480" cy="620" r="46" fill="none" stroke="#e57426" stroke-width="4"/>
  <circle cx="480" cy="620" r="46" fill="#e57426" fill-opacity="0.18"/>

  <!-- linha de confronto -->
  <line x1="526" y1="620" x2="930" y2="580" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 10"/>

  <!-- estrela do norte, pequena, proximo ao circulo menor -->
  <path d="M 480 540 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 Z" fill="#f4f6fa" fill-opacity="0.7"/>

  <ellipse cx="800" cy="450" rx="620" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
