<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- silhueta abstrata de uma chuteira -->
  <g transform="translate(650,480)" fill="none" stroke="#f4f6fa" stroke-opacity="0.7" stroke-width="4" stroke-linejoin="round">
    <path d="M -220 40 Q -220 -60 -120 -80 L 40 -110 Q 140 -120 200 -60 Q 240 -20 220 40 Q 200 80 100 80 L -160 80 Q -220 80 -220 40 Z"/>
    <!-- cadarcos -->
    <line x1="-100" y1="-70" x2="-40" y2="30" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="-60" y1="-78" x2="0" y2="30" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="-20" y1="-84" x2="40" y2="28" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- sensor no cadarco -->
  <circle cx="590" cy="420" r="14" fill="#e57426"/>
  <circle cx="590" cy="420" r="26" fill="none" stroke="#e57426" stroke-opacity="0.5" stroke-width="3"/>

  <!-- ondas de dado saindo do sensor -->
  <g fill="none" stroke="#e57426" stroke-opacity="0.45" stroke-width="2">
    <path d="M 630 380 a 90 90 0 0 1 60 60"/>
    <path d="M 660 340 a 150 150 0 0 1 100 100"/>
  </g>

  <!-- pontos de dado (1000 amostras/segundo, representados como constelacao) -->
  <g fill="#e6eaf3" fill-opacity="0.5">
    <circle cx="920" cy="330" r="4"/>
    <circle cx="980" cy="380" r="3"/>
    <circle cx="960" cy="450" r="4"/>
    <circle cx="1040" cy="410" r="3"/>
    <circle cx="1020" cy="490" r="4"/>
    <circle cx="1090" cy="460" r="3"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
