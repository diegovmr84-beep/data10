<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- dois quadros de video sendo comparados -->
  <g stroke="#7686a8" stroke-opacity="0.4" stroke-width="2" fill="none">
    <rect x="330" y="270" width="360" height="440" rx="10"/>
    <rect x="910" y="270" width="360" height="440" rx="10"/>
  </g>

  <!-- silhueta articulada esquerda (pontos conectados) -->
  <g stroke="#f4f6fa" stroke-opacity="0.55" stroke-width="3" fill="#e57426">
    <circle cx="510" cy="360" r="8"/>
    <line x1="510" y1="368" x2="510" y2="470"/>
    <circle cx="510" cy="470" r="6"/>
    <line x1="510" y1="420" x2="460" y2="470"/>
    <line x1="510" y1="420" x2="560" y2="470"/>
    <circle cx="460" cy="470" r="6"/>
    <circle cx="560" cy="470" r="6"/>
    <line x1="510" y1="470" x2="475" y2="580"/>
    <line x1="510" y1="470" x2="545" y2="580"/>
    <circle cx="475" cy="580" r="6"/>
    <circle cx="545" cy="580" r="6"/>
  </g>

  <!-- silhueta articulada direita, postura levemente diferente -->
  <g stroke="#f4f6fa" stroke-opacity="0.55" stroke-width="3" fill="#7686a8">
    <circle cx="1090" cy="360" r="8"/>
    <line x1="1090" y1="368" x2="1100" y2="470"/>
    <circle cx="1100" cy="470" r="6"/>
    <line x1="1100" y1="420" x2="1040" y2="450"/>
    <line x1="1100" y1="420" x2="1150" y2="460"/>
    <circle cx="1040" cy="450" r="6"/>
    <circle cx="1150" cy="460" r="6"/>
    <line x1="1100" y1="470" x2="1060" y2="590"/>
    <line x1="1100" y1="470" x2="1140" y2="570"/>
    <circle cx="1060" cy="590" r="6"/>
    <circle cx="1140" cy="570" r="6"/>
  </g>

  <!-- sinal de comparacao entre os dois -->
  <text x="800" y="500" text-anchor="middle" fill="#e6eaf3" fill-opacity="0.4" font-family="sans-serif" font-size="46" font-weight="bold">VS</text>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
