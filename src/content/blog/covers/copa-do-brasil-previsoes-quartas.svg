<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- alvo estilizado: previsão vs. resultado real -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2.5">
    <circle cx="800" cy="450" r="280"/>
    <circle cx="800" cy="450" r="190"/>
    <circle cx="800" cy="450" r="100"/>
  </g>

  <!-- marcações: a maioria perto do centro (acertos), uma mais longe (o erro do placar do Gre-Nal) -->
  <g fill="#e57426">
    <circle cx="820" cy="430" r="10"/>
    <circle cx="770" cy="470" r="10"/>
    <circle cx="830" cy="480" r="10"/>
  </g>
  <g fill="#f4f6fa">
    <circle cx="600" cy="300" r="12"/>
  </g>

  <!-- linha conectando o "erro" ao centro, como uma leitura de desvio -->
  <path d="M 600 300 L 800 450" stroke="#e6eaf3" stroke-opacity="0.3" stroke-dasharray="2 10" stroke-width="2"/>

  <circle cx="800" cy="450" r="6" fill="#f4f6fa"/>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
