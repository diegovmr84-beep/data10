<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="800" font-family="Source Serif 4, Georgia, serif" font-size="280" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">1 só</text>

  <!-- dois conjuntos de pontos convergindo pra um so -->
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="470" cy="330" r="9"/>
    <circle cx="420" cy="380" r="9"/>
    <circle cx="500" cy="420" r="9"/>
    <circle cx="440" cy="460" r="9"/>
    <circle cx="510" cy="300" r="9"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="470" cy="610" r="9"/>
    <circle cx="420" cy="560" r="9"/>
    <circle cx="500" cy="530" r="9"/>
    <circle cx="440" cy="650" r="9"/>
    <circle cx="510" cy="680" r="9"/>
  </g>

  <!-- linhas convergindo -->
  <g stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2">
    <line x1="470" y1="330" x2="900" y2="470"/>
    <line x1="420" y1="380" x2="900" y2="470"/>
    <line x1="500" y1="420" x2="900" y2="470"/>
    <line x1="440" y1="460" x2="900" y2="470"/>
    <line x1="510" y1="300" x2="900" y2="470"/>
    <line x1="470" y1="610" x2="900" y2="470"/>
    <line x1="420" y1="560" x2="900" y2="470"/>
    <line x1="500" y1="530" x2="900" y2="470"/>
    <line x1="440" y1="650" x2="900" y2="470"/>
    <line x1="510" y1="680" x2="900" y2="470"/>
  </g>

  <!-- ponto unificado em destaque -->
  <circle cx="900" cy="470" r="30" fill="#e57426"/>
  <circle cx="900" cy="470" r="48" fill="none" stroke="#e57426" stroke-opacity="0.35" stroke-width="2"/>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="280" height="46" rx="23" fill="#e57426"/>
    <text x="140" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">GESTÃO ESPORTIVA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
