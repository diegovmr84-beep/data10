<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- fiel da balanca -->
  <line x1="800" y1="220" x2="800" y2="560" stroke="#7686a8" stroke-opacity="0.4" stroke-width="4"/>
  <line x1="560" y1="300" x2="1040" y2="300" stroke="#7686a8" stroke-opacity="0.4" stroke-width="4"/>
  <circle cx="800" cy="300" r="10" fill="#7686a8" fill-opacity="0.5"/>

  <!-- prato esquerdo, baixo, cheio de pontos densos -->
  <g>
    <line x1="560" y1="300" x2="560" y2="470" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2"/>
    <ellipse cx="560" cy="490" rx="130" ry="26" fill="none" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="3"/>
    <g fill="#e57426" fill-opacity="0.85">
      <circle cx="500" cy="480" r="7"/>
      <circle cx="525" cy="470" r="7"/>
      <circle cx="550" cy="482" r="7"/>
      <circle cx="575" cy="472" r="7"/>
      <circle cx="600" cy="484" r="7"/>
      <circle cx="515" cy="495" r="7"/>
      <circle cx="540" cy="500" r="7"/>
      <circle cx="565" cy="495" r="7"/>
      <circle cx="590" cy="498" r="7"/>
      <circle cx="480" cy="492" r="7"/>
    </g>
  </g>

  <!-- prato direito, mais alto, poucos pontos -->
  <g>
    <line x1="1040" y1="300" x2="1040" y2="400" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2"/>
    <ellipse cx="1040" cy="420" rx="130" ry="26" fill="none" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="3"/>
    <g fill="#7686a8" fill-opacity="0.7">
      <circle cx="1010" cy="410" r="7"/>
      <circle cx="1060" cy="412" r="7"/>
      <circle cx="1035" cy="422" r="7"/>
    </g>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
