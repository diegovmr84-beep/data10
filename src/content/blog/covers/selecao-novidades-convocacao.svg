<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#0C6B3D" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0C6B3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- silhuetas de jogadores em formação, alguns em destaque (candidatos) -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2.5">
    <circle cx="420" cy="620" r="26"/>
    <circle cx="620" cy="560" r="26"/>
    <circle cx="980" cy="560" r="26"/>
    <circle cx="1180" cy="620" r="26"/>
  </g>

  <g fill="none" stroke="#e57426" stroke-width="3">
    <circle cx="800" cy="320" r="34"/>
    <circle cx="620" cy="420" r="30"/>
    <circle cx="980" cy="420" r="30"/>
  </g>

  <!-- pontos de interrogação sutis sobre os candidatos em destaque, representando incerteza da previsão -->
  <g fill="none" stroke="#f4f6fa" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M 788 300 a 14 14 0 1 1 20 13 c -7 5 -8 8 -8 16"/>
    <circle cx="800" cy="343" r="1.3" fill="#f4f6fa" fill-opacity="0.55" stroke="none"/>
  </g>

  <!-- linhas de conexão, formação tática -->
  <g fill="none" stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2">
    <path d="M 420 620 L 620 560 L 620 420 L 800 320 L 980 420 L 980 560 L 1180 620"/>
  </g>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
