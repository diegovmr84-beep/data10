<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- triangulo do somatotipo (endo / meso / ecto) -->
  <g transform="translate(800,470)">
    <path d="M 0 -230 L -260 190 L 260 190 Z" fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="3" stroke-linejoin="round"/>

    <!-- vertices -->
    <circle cx="0" cy="-230" r="8" fill="#e57426"/>
    <circle cx="-260" cy="190" r="8" fill="#e57426"/>
    <circle cx="260" cy="190" r="8" fill="#e57426"/>

    <!-- ponto de exemplo, um perfil marcado dentro do triangulo -->
    <circle cx="70" cy="20" r="12" fill="#f4f6fa" fill-opacity="0.85"/>
    <line x1="0" y1="-230" x2="70" y2="20" stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 8"/>
    <line x1="-260" y1="190" x2="70" y2="20" stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 8"/>
    <line x1="260" y1="190" x2="70" y2="20" stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 8"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
