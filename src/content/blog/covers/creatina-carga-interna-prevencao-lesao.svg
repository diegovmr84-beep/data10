<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- molecula estilizada a esquerda (creatina, simplificada) -->
  <g transform="translate(460,420)" stroke="#f4f6fa" stroke-opacity="0.6" stroke-width="3" fill="none">
    <circle cx="0" cy="-70" r="16" fill="#e57426" fill-opacity="0.85" stroke="none"/>
    <circle cx="-70" cy="30" r="16" fill="#7686a8" fill-opacity="0.7" stroke="none"/>
    <circle cx="70" cy="30" r="16" fill="#7686a8" fill-opacity="0.7" stroke="none"/>
    <circle cx="0" cy="110" r="16" fill="#f4f6fa" fill-opacity="0.8" stroke="none"/>
    <line x1="0" y1="-54" x2="-70" y2="14"/>
    <line x1="0" y1="-54" x2="70" y2="14"/>
    <line x1="-70" y1="46" x2="0" y2="94"/>
    <line x1="70" y1="46" x2="0" y2="94"/>
  </g>

  <!-- grafico de barras com intervalo de confianca largo, a direita -->
  <g>
    <line x1="950" y1="650" x2="1300" y2="650" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="1000" y="500" width="60" height="150" fill="#e57426" fill-opacity="0.75"/>
    <rect x="1150" y="380" width="60" height="270" fill="#7686a8" fill-opacity="0.5"/>
  </g>

  <!-- barra de erro larga sobre a primeira coluna, indicando incerteza -->
  <g stroke="#f4f6fa" stroke-opacity="0.65" stroke-width="3">
    <line x1="1030" y1="420" x2="1030" y2="600"/>
    <line x1="1012" y1="420" x2="1048" y2="420"/>
    <line x1="1012" y1="600" x2="1048" y2="600"/>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
