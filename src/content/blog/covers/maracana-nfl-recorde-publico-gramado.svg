<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="800" font-family="Source Serif 4, Georgia, serif" font-size="360" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">94%</text>

  <!-- campo de futebol (linhas finas) -->
  <g stroke="#7686a8" stroke-opacity="0.4" stroke-width="3" fill="none">
    <rect x="280" y="260" width="1040" height="500"/>
    <circle cx="800" cy="510" r="90"/>
    <line x1="800" y1="260" x2="800" y2="760"/>
  </g>

  <!-- campo de futebol americano sobreposto, deslocado, com faixas de jarda -->
  <g stroke="#e57426" stroke-opacity="0.85" stroke-width="4" fill="none">
    <rect x="330" y="330" width="940" height="300"/>
    <line x1="430" y1="330" x2="430" y2="630"/>
    <line x1="1170" y1="330" x2="1170" y2="630"/>
  </g>
  <g stroke="#e57426" stroke-opacity="0.4" stroke-width="2" fill="none">
    <line x1="530" y1="330" x2="530" y2="630"/>
    <line x1="630" y1="330" x2="630" y2="630"/>
    <line x1="730" y1="330" x2="730" y2="630"/>
    <line x1="830" y1="330" x2="830" y2="630"/>
    <line x1="930" y1="330" x2="930" y2="630"/>
    <line x1="1030" y1="330" x2="1030" y2="630"/>
  </g>

  <!-- pontos de publico, representando lotacao -->
  <g fill="#f4f6fa" fill-opacity="0.7">
    <circle cx="340" cy="290" r="5"/><circle cx="380" cy="285" r="5"/><circle cx="420" cy="292" r="5"/>
    <circle cx="1200" cy="288" r="5"/><circle cx="1240" cy="293" r="5"/><circle cx="1280" cy="286" r="5"/>
    <circle cx="340" cy="700" r="5"/><circle cx="380" cy="705" r="5"/><circle cx="1240" cy="702" r="5"/>
  </g>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="280" height="46" rx="23" fill="#e57426"/>
    <text x="140" y="30" font-family="Inter, sans-serif" font-size="19" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">GESTÃO ESPORTIVA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
