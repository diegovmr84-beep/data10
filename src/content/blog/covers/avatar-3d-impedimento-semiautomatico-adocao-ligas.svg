<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- nuvem de pontos de escaneamento a esquerda -->
  <g fill="#7686a8" fill-opacity="0.55">
    <circle cx="430" cy="300" r="4"/>
    <circle cx="470" cy="290" r="4"/>
    <circle cx="510" cy="310" r="4"/>
    <circle cx="400" cy="360" r="4"/>
    <circle cx="450" cy="380" r="4"/>
    <circle cx="500" cy="370" r="4"/>
    <circle cx="540" cy="350" r="4"/>
    <circle cx="420" cy="450" r="4"/>
    <circle cx="470" cy="470" r="4"/>
    <circle cx="520" cy="460" r="4"/>
    <circle cx="440" cy="560" r="4"/>
    <circle cx="500" cy="580" r="4"/>
    <circle cx="410" cy="620" r="4"/>
    <circle cx="530" cy="630" r="4"/>
  </g>

  <!-- seta de transformacao -->
  <path d="M 650 460 L 850 460" stroke="#e57426" stroke-opacity="0.55" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e57426" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- silhueta solida reconstruida a direita -->
  <g fill="#f4f6fa" fill-opacity="0.85">
    <circle cx="1050" cy="300" r="34"/>
    <path d="M 1000 350 Q 1050 330 1100 350 L 1115 480 Q 1050 500 985 480 Z"/>
    <rect x="960" y="480" width="35" height="150" rx="16"/>
    <rect x="1105" y="480" width="35" height="150" rx="16"/>
  </g>
  <g stroke="#e57426" stroke-opacity="0.4" stroke-width="1" fill="none">
    <line x1="1000" y1="350" x2="1100" y2="350"/>
    <line x1="985" y1="480" x2="1115" y2="480"/>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
