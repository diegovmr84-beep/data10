<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="820" font-family="Source Serif 4, Georgia, serif" font-size="280" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">27%</text>

  <!-- area de penalti vista de cima, grande arco de escanteio -->
  <g stroke="#7686a8" stroke-opacity="0.45" stroke-width="3" fill="none">
    <rect x="430" y="140" width="740" height="620" />
    <rect x="560" y="140" width="480" height="260" />
    <path d="M 430 140 A 60 60 0 0 1 430 200" />
  </g>

  <!-- zonas de disputa: pontos neutros -->
  <g fill="#7686a8" fill-opacity="0.55">
    <circle cx="640" cy="260" r="10"/>
    <circle cx="720" cy="230" r="10"/>
    <circle cx="860" cy="230" r="10"/>
    <circle cx="940" cy="260" r="10"/>
    <circle cx="600" cy="330" r="10"/>
    <circle cx="980" cy="330" r="10"/>
  </g>

  <!-- zona de disputa em destaque (primeiro pau) -->
  <circle cx="700" cy="300" r="46" fill="#e57426" fill-opacity="0.25"/>
  <circle cx="700" cy="300" r="16" fill="#e57426"/>

  <!-- linha de trajetoria do escanteio -->
  <path d="M 430 150 Q 560 230 700 300" stroke="#e57426" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- rotulo da zona -->
  <text x="700" y="400" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#f4f6fa" fill-opacity="0.85" text-anchor="middle">ZONA DE DISPUTA</text>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="300" height="46" rx="23" fill="#e57426"/>
    <text x="150" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">ANÁLISE TÁTICA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
