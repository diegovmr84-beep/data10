<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- montanha estilizada -->
  <path d="M 200 640 L 460 300 L 640 480 L 820 260 L 1050 640 Z" fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="3" stroke-linejoin="round"/>

  <!-- linha do tempo horizontal, com janela de risco destacada -->
  <g transform="translate(0,720)">
    <line x1="240" y1="0" x2="1360" y2="0" stroke="#e6eaf3" stroke-opacity="0.3" stroke-width="2"/>

    <!-- janela de risco (24-72h) -->
    <rect x="480" y="-16" width="240" height="32" fill="#e57426" fill-opacity="0.18"/>
    <line x1="480" y1="-16" x2="480" y2="16" stroke="#e57426" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="720" y1="-16" x2="720" y2="16" stroke="#e57426" stroke-opacity="0.5" stroke-width="2"/>

    <!-- marcador: chegada -->
    <circle cx="300" cy="0" r="8" fill="#f4f6fa" fill-opacity="0.8"/>
    <!-- marcador: jogo -->
    <circle cx="600" cy="0" r="8" fill="#e57426"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
