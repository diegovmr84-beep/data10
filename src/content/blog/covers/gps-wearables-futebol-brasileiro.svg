<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- colete GPS estilizado, visto de costas -->
  <g transform="translate(800,470)">
    <path d="M -140 -160 C -140 -220 -60 -250 0 -250 C 60 -250 140 -220 140 -160 L 140 160 C 140 220 80 250 0 250 C -80 250 -140 220 -140 160 Z"
          fill="none" stroke="#7686a8" stroke-opacity="0.5" stroke-width="3"/>
    <!-- bolso do transmissor GPS entre as escápulas -->
    <rect x="-55" y="-140" width="110" height="90" rx="14" fill="none" stroke="#e57426" stroke-width="3"/>
    <circle cx="0" cy="-95" r="10" fill="#e57426"/>

    <!-- linhas de dados saindo do dispositivo -->
    <g fill="none" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <path d="M 60 -95 L 160 -130"/>
      <path d="M 60 -70 L 170 -60"/>
      <path d="M 60 -45 L 160 10"/>
    </g>
    <g fill="#f4f6fa" fill-opacity="0.6">
      <circle cx="160" cy="-130" r="4"/>
      <circle cx="170" cy="-60" r="4"/>
      <circle cx="160" cy="10" r="4"/>
    </g>

    <!-- alças cruzadas -->
    <path d="M -60 -150 L -20 40" fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M 60 -150 L 20 40" fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
