<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- multiplos nos perifericos (clubes) convergindo para um hub central -->
  <g stroke="#7686a8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="300" y1="230" x2="800" y2="450"/>
    <line x1="260" y1="380" x2="800" y2="450"/>
    <line x1="290" y1="540" x2="800" y2="450"/>
    <line x1="360" y1="670" x2="800" y2="450"/>
    <line x1="1300" y1="230" x2="800" y2="450"/>
    <line x1="1340" y1="380" x2="800" y2="450"/>
    <line x1="1310" y1="540" x2="800" y2="450"/>
    <line x1="1240" y1="670" x2="800" y2="450"/>
  </g>

  <g fill="#7686a8" fill-opacity="0.65">
    <circle cx="300" cy="230" r="10"/>
    <circle cx="260" cy="380" r="10"/>
    <circle cx="290" cy="540" r="10"/>
    <circle cx="360" cy="670" r="10"/>
    <circle cx="1300" cy="230" r="10"/>
    <circle cx="1340" cy="380" r="10"/>
    <circle cx="1310" cy="540" r="10"/>
    <circle cx="1240" cy="670" r="10"/>
  </g>

  <!-- hub central unico -->
  <circle cx="800" cy="450" r="70" fill="none" stroke="#e57426" stroke-width="4"/>
  <circle cx="800" cy="450" r="34" fill="#e57426" fill-opacity="0.85"/>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
