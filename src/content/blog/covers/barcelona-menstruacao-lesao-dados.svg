<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="800" font-family="Source Serif 4, Georgia, serif" font-size="280" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">3x</text>

  <!-- anel de ciclo, maior parte neutra, um arco em destaque -->
  <circle cx="620" cy="470" r="170" fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="26"/>
  <path d="M 620 300 A 170 170 0 0 1 740 352" fill="none" stroke="#e57426" stroke-width="26" stroke-linecap="round"/>

  <!-- barras comparativas de dias perdidos -->
  <g>
    <rect x="980" y="620" width="70" height="90" rx="6" fill="#7686a8" fill-opacity="0.5"/>
    <text x="1015" y="735" font-family="Inter, sans-serif" font-size="16" fill="#f4f6fa" fill-opacity="0.6" text-anchor="middle">206</text>

    <rect x="1090" y="380" width="70" height="330" rx="6" fill="#e57426"/>
    <text x="1125" y="735" font-family="Inter, sans-serif" font-size="16" fill="#f4f6fa" fill-opacity="0.9" text-anchor="middle">684</text>
  </g>
  <text x="1055" y="755" font-family="Inter, sans-serif" font-size="15" fill="#f4f6fa" fill-opacity="0.5" text-anchor="middle">dias perdidos / 1.000h</text>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="340" height="46" rx="23" fill="#e57426"/>
    <text x="170" y="30" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">ESTATÍSTICA AVANÇADA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
