<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- tabela única, 36 barras, três zonas de cor -->
  <g transform="translate(760,450)">
    <g stroke-linecap="round">
      <!-- zona direta: 1-8, ember -->
      <line x1="-620" y1="-220" x2="-620" y2="-140" stroke="#e57426" stroke-width="14"/>
      <line x1="-580" y1="-220" x2="-580" y2="-155" stroke="#e57426" stroke-width="14"/>
      <line x1="-540" y1="-220" x2="-540" y2="-125" stroke="#e57426" stroke-width="14"/>
      <line x1="-500" y1="-220" x2="-500" y2="-100" stroke="#e57426" stroke-width="14"/>
      <line x1="-460" y1="-220" x2="-460" y2="-90" stroke="#e57426" stroke-width="14"/>
      <line x1="-420" y1="-220" x2="-420" y2="-60" stroke="#e57426" stroke-width="14"/>
      <line x1="-380" y1="-220" x2="-380" y2="-40" stroke="#e57426" stroke-width="14"/>
      <line x1="-340" y1="-220" x2="-340" y2="-20" stroke="#e57426" stroke-width="14"/>

      <!-- linha de corte 1: direto -->
      <line x1="-310" y1="-260" x2="-310" y2="260" stroke="#f4f6fa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 10"/>

      <!-- zona playoff: 9-24, slate -->
      <g stroke="#7686a8" stroke-width="12">
        <line x1="-270" y1="-220" x2="-270" y2="10"/>
        <line x1="-232" y1="-220" x2="-232" y2="25"/>
        <line x1="-194" y1="-220" x2="-194" y2="40"/>
        <line x1="-156" y1="-220" x2="-156" y2="50"/>
        <line x1="-118" y1="-220" x2="-118" y2="60"/>
        <line x1="-80" y1="-220" x2="-80" y2="70"/>
        <line x1="-42" y1="-220" x2="-42" y2="78"/>
        <line x1="-4" y1="-220" x2="-4" y2="85"/>
        <line x1="34" y1="-220" x2="34" y2="92"/>
        <line x1="72" y1="-220" x2="72" y2="98"/>
        <line x1="110" y1="-220" x2="110" y2="104"/>
        <line x1="148" y1="-220" x2="148" y2="110"/>
        <line x1="186" y1="-220" x2="186" y2="115"/>
        <line x1="224" y1="-220" x2="224" y2="119"/>
        <line x1="262" y1="-220" x2="262" y2="123"/>
        <line x1="300" y1="-220" x2="300" y2="126"/>
      </g>

      <!-- linha de corte 2: eliminação -->
      <line x1="330" y1="-260" x2="330" y2="260" stroke="#f4f6fa" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 10"/>

      <!-- zona eliminada -->
      <g stroke="#7686a8" stroke-opacity="0.25" stroke-width="12">
        <line x1="368" y1="-220" x2="368" y2="130"/>
        <line x1="406" y1="-220" x2="406" y2="133"/>
        <line x1="444" y1="-220" x2="444" y2="136"/>
        <line x1="482" y1="-220" x2="482" y2="138"/>
        <line x1="520" y1="-220" x2="520" y2="140"/>
        <line x1="558" y1="-220" x2="558" y2="142"/>
      </g>
    </g>
  </g>

  <ellipse cx="800" cy="450" rx="620" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
