<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- linhas de tabela estilizadas -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2">
    <line x1="360" y1="300" x2="1240" y2="300"/>
    <line x1="360" y1="390" x2="1240" y2="390"/>
    <line x1="360" y1="480" x2="1240" y2="480"/>
    <line x1="360" y1="570" x2="1240" y2="570"/>
    <line x1="360" y1="660" x2="1240" y2="660"/>
  </g>

  <!-- seta pra cima: time surpreendendo -->
  <g transform="translate(1120,330)" fill="none" stroke="#4a9d6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 40 L 0 -30"/>
    <path d="M -16 -12 L 0 -30 L 16 -12"/>
  </g>

  <!-- seta pra baixo: time decepcionando -->
  <g transform="translate(1120,600)" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 -40 L 0 30"/>
    <path d="M -16 12 L 0 30 L 16 12"/>
  </g>

  <!-- barras representando pontos de times, com destaque em laranja -->
  <g fill="#7686a8" fill-opacity="0.5">
    <rect x="420" y="330" width="60" height="330" opacity="0"/>
  </g>
  <g fill="#e57426">
    <rect x="420" y="500" width="46" height="160"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.55">
    <rect x="500" y="420" width="46" height="240"/>
    <rect x="580" y="380" width="46" height="280"/>
    <rect x="660" y="460" width="46" height="200"/>
    <rect x="740" y="330" width="46" height="330"/>
    <rect x="820" y="400" width="46" height="260"/>
    <rect x="900" y="440" width="46" height="220"/>
    <rect x="980" y="360" width="46" height="300"/>
  </g>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
