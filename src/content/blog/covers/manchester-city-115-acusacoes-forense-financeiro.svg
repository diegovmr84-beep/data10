<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="800" font-family="Source Serif 4, Georgia, serif" font-size="300" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">114/115</text>

  <!-- nota/recibo, dividido em duas partes de valor -->
  <g transform="translate(660,230)">
    <rect width="360" height="480" rx="10" fill="#16223f" stroke="#7686a8" stroke-opacity="0.5" stroke-width="2"/>
    <!-- linhas de texto simuladas, parte de cima (soma legitima, pequena) -->
    <rect x="30" y="40" width="300" height="10" rx="4" fill="#7686a8" fill-opacity="0.5"/>
    <rect x="30" y="70" width="220" height="10" rx="4" fill="#7686a8" fill-opacity="0.5"/>
    <rect x="30" y="100" width="260" height="10" rx="4" fill="#7686a8" fill-opacity="0.5"/>
    <!-- divisoria -->
    <line x1="20" y1="150" x2="340" y2="150" stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>
    <!-- parte de baixo (soma etiquetada, oculta, maior, em destaque ember) -->
    <rect x="30" y="180" width="300" height="220" rx="6" fill="#e57426" fill-opacity="0.16" stroke="#e57426" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="55" y="210" width="250" height="10" rx="4" fill="#e57426" fill-opacity="0.7"/>
    <rect x="55" y="240" width="190" height="10" rx="4" fill="#e57426" fill-opacity="0.7"/>
    <rect x="55" y="270" width="220" height="10" rx="4" fill="#e57426" fill-opacity="0.7"/>
    <rect x="55" y="300" width="160" height="10" rx="4" fill="#e57426" fill-opacity="0.7"/>
    <!-- selo de "oculto" -->
    <circle cx="180" cy="355" r="26" fill="none" stroke="#e57426" stroke-width="3"/>
    <text x="180" y="362" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#e57426" text-anchor="middle">?</text>
    <!-- rodape -->
    <rect x="30" y="430" width="300" height="10" rx="4" fill="#7686a8" fill-opacity="0.4"/>
  </g>

  <!-- lupa de pericia, sobrepondo a parte oculta -->
  <g transform="translate(940,470)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f4f6fa" stroke-opacity="0.85" stroke-width="8"/>
    <line x1="50" y1="50" x2="110" y2="110" stroke="#f4f6fa" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="280" height="46" rx="23" fill="#e57426"/>
    <text x="140" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">GESTÃO ESPORTIVA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
