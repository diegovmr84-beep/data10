<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- trajetoria de bola com valores crescentes -->
  <path d="M 340 620 C 550 600, 700 520, 850 440 C 1000 360, 1150 320, 1280 300"
        fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="2 10"/>

  <g fill="#f4f6fa">
    <circle cx="340" cy="620" r="9"/>
    <circle cx="600" cy="565" r="9"/>
    <circle cx="850" cy="440" r="9"/>
    <circle cx="1080" cy="350" r="9"/>
    <circle cx="1280" cy="300" r="11" fill="#e57426"/>
  </g>

  <g font-family="sans-serif" fill="#e6eaf3" fill-opacity="0.55" font-size="22">
    <text x="340" y="660">0,4%</text>
    <text x="600" y="605">0,9%</text>
    <text x="850" y="480">1,3%</text>
    <text x="1050" y="390">1,7%</text>
    <text x="1230" y="270" fill="#e57426" fill-opacity="0.9" font-weight="bold">GOL</text>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
