<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- múltiplos agentes de IA (nós satélites) convergindo para uma decisão central -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2">
    <path d="M 420 260 L 800 450"/>
    <path d="M 1180 260 L 800 450"/>
    <path d="M 340 500 L 800 450"/>
    <path d="M 1260 520 L 800 450"/>
    <path d="M 560 660 L 800 450"/>
    <path d="M 1040 670 L 800 450"/>
  </g>

  <!-- agentes: cada um com um pequeno anel orbitando, representando autonomia -->
  <g fill="#f4f6fa">
    <circle cx="420" cy="260" r="11"/>
    <circle cx="1180" cy="260" r="11"/>
    <circle cx="340" cy="500" r="11"/>
    <circle cx="1260" cy="520" r="11"/>
    <circle cx="560" cy="660" r="11"/>
    <circle cx="1040" cy="670" r="11"/>
  </g>
  <g fill="none" stroke="#e6eaf3" stroke-opacity="0.3" stroke-width="1.5">
    <circle cx="420" cy="260" r="22"/>
    <circle cx="1180" cy="260" r="22"/>
    <circle cx="340" cy="500" r="22"/>
    <circle cx="1260" cy="520" r="22"/>
    <circle cx="560" cy="660" r="22"/>
    <circle cx="1040" cy="670" r="22"/>
  </g>

  <!-- núcleo de decisão -->
  <circle cx="800" cy="450" r="34" fill="none" stroke="#e57426" stroke-width="3"/>
  <circle cx="800" cy="450" r="14" fill="#e57426"/>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
