<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- podio: barras de alturas diferentes -->
  <g>
    <rect x="560" y="560" width="140" height="180" rx="6" fill="#7686a8" fill-opacity="0.45"/>
    <rect x="730" y="440" width="140" height="300" rx="6" fill="#e57426" fill-opacity="0.85"/>
    <rect x="900" y="610" width="140" height="130" rx="6" fill="#7686a8" fill-opacity="0.3"/>
  </g>

  <!-- silhuetas simples no topo de cada barra -->
  <g fill="#f4f6fa" fill-opacity="0.8">
    <circle cx="630" cy="535" r="20"/>
    <circle cx="800" cy="415" r="20"/>
    <circle cx="970" cy="585" r="20"/>
  </g>

  <!-- painel de indicadores numericos a esquerda -->
  <g stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2">
    <line x1="300" y1="330" x2="470" y2="330"/>
    <line x1="300" y1="380" x2="440" y2="380"/>
    <line x1="300" y1="430" x2="455" y2="430"/>
  </g>
  <g fill="#e57426" fill-opacity="0.7">
    <circle cx="300" cy="330" r="6"/>
    <circle cx="300" cy="380" r="6"/>
    <circle cx="300" cy="430" r="6"/>
  </g>

  <!-- painel de indicadores a direita, espelhado -->
  <g stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2">
    <line x1="1300" y1="330" x2="1130" y2="330"/>
    <line x1="1300" y1="380" x2="1160" y2="380"/>
    <line x1="1300" y1="430" x2="1145" y2="430"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.7">
    <circle cx="1300" cy="330" r="6"/>
    <circle cx="1300" cy="380" r="6"/>
    <circle cx="1300" cy="430" r="6"/>
  </g>

  <ellipse cx="800" cy="450" rx="640" ry="430" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
