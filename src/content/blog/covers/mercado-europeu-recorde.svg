<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- gráfico de barras ascendente, representando o recorde de gastos -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2">
    <line x1="420" y1="640" x2="1180" y2="640"/>
    <line x1="420" y1="640" x2="420" y2="260"/>
  </g>

  <g fill="#7686a8" fill-opacity="0.55">
    <rect x="470" y="560" width="90" height="80"/>
    <rect x="610" y="500" width="90" height="140"/>
    <rect x="750" y="430" width="90" height="210"/>
  </g>
  <g fill="#e57426">
    <rect x="890" y="330" width="90" height="310"/>
  </g>

  <!-- seta de crescimento -->
  <path d="M 470 555 L 610 495 L 750 425 L 900 325" fill="none" stroke="#f4f6fa" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M 900 325 L 878 345 M 900 325 L 922 348" fill="none" stroke="#f4f6fa" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ponto de interrogação sutil, representando a dúvida sobre se os preços fazem sentido -->
  <g transform="translate(1180,280)" fill="none" stroke="#e6eaf3" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <path d="M -14 -18 a 18 18 0 1 1 24 17 c -8 6 -10 10 -10 20"/>
    <circle cx="0" cy="46" r="1.5" fill="#e6eaf3" fill-opacity="0.45" stroke="none"/>
  </g>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
