<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- prancheta -->
  <g transform="translate(800,450)">
    <rect x="-260" y="-320" width="520" height="640" rx="18" fill="none" stroke="#7686a8" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="-70" y="-346" width="140" height="46" rx="10" fill="none" stroke="#7686a8" stroke-opacity="0.55" stroke-width="3"/>

    <!-- itens da lista, quatro confirmados -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(-200,-210)">
        <circle r="26" fill="none" stroke="#e57426" stroke-width="3"/>
        <path d="M -11 0 L -3 9 L 12 -11" fill="none" stroke="#e57426" stroke-width="4"/>
        <line x1="46" y1="0" x2="230" y2="0" stroke="#e6eaf3" stroke-opacity="0.5" stroke-width="4"/>
      </g>
      <g transform="translate(-200,-100)">
        <circle r="26" fill="none" stroke="#e57426" stroke-width="3"/>
        <path d="M -11 0 L -3 9 L 12 -11" fill="none" stroke="#e57426" stroke-width="4"/>
        <line x1="46" y1="0" x2="230" y2="0" stroke="#e6eaf3" stroke-opacity="0.5" stroke-width="4"/>
      </g>
      <g transform="translate(-200,10)">
        <circle r="26" fill="none" stroke="#e57426" stroke-width="3"/>
        <path d="M -11 0 L -3 9 L 12 -11" fill="none" stroke="#e57426" stroke-width="4"/>
        <line x1="46" y1="0" x2="230" y2="0" stroke="#e6eaf3" stroke-opacity="0.5" stroke-width="4"/>
      </g>
      <g transform="translate(-200,120)">
        <circle r="26" fill="none" stroke="#e57426" stroke-width="3"/>
        <path d="M -11 0 L -3 9 L 12 -11" fill="none" stroke="#e57426" stroke-width="4"/>
        <line x1="46" y1="0" x2="230" y2="0" stroke="#e6eaf3" stroke-opacity="0.5" stroke-width="4"/>
      </g>

      <!-- item em revisão -->
      <g transform="translate(-200,230)">
        <circle r="26" fill="none" stroke="#7686a8" stroke-opacity="0.6" stroke-width="3"/>
        <text x="0" y="10" font-family="Georgia, serif" font-size="30" fill="#7686a8" fill-opacity="0.8" text-anchor="middle">?</text>
        <line x1="46" y1="0" x2="230" y2="0" stroke="#e6eaf3" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="2 8"/>
      </g>
    </g>
  </g>

  <ellipse cx="800" cy="450" rx="580" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
