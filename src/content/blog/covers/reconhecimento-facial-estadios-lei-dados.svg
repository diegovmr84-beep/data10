<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e57426" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e57426" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e57426" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- contorno de rosto abstrato como malha de pontos (landmarks) -->
  <g stroke="#7686a8" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M 660 260 C 560 300 540 420 560 520 C 580 640 680 720 800 720 C 920 720 1020 640 1040 520 C 1060 420 1040 300 940 260 C 860 230 740 230 660 260 Z"/>
    <path d="M 640 470 C 680 450 730 450 760 470"/>
    <path d="M 840 470 C 870 450 920 450 960 470"/>
    <path d="M 780 500 L 760 580 C 760 600 780 610 800 605"/>
    <path d="M 700 650 C 740 680 860 680 900 650"/>
  </g>

  <!-- pontos de referência (landmarks) -->
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="660" cy="260" r="5"/><circle cx="940" cy="260" r="5"/>
    <circle cx="560" cy="520" r="5"/><circle cx="1040" cy="520" r="5"/>
    <circle cx="640" cy="470" r="5"/><circle cx="760" cy="470" r="5"/>
    <circle cx="840" cy="470" r="5"/><circle cx="960" cy="470" r="5"/>
    <circle cx="780" cy="500" r="5"/><circle cx="800" cy="605" r="5"/>
    <circle cx="700" cy="650" r="5"/><circle cx="900" cy="650" r="5"/>
    <circle cx="800" cy="720" r="5"/>
  </g>

  <!-- linha de varredura biométrica -->
  <rect x="500" y="452" width="600" height="4" fill="url(#scan)"/>

  <!-- moldura de enquadramento (canto de scanner), em destaque -->
  <g stroke="#e57426" stroke-width="4" fill="none" stroke-opacity="0.85">
    <path d="M 470 300 L 470 250 L 520 250"/>
    <path d="M 1130 300 L 1130 250 L 1080 250"/>
    <path d="M 470 680 L 470 730 L 520 730"/>
    <path d="M 1130 680 L 1130 730 L 1080 730"/>
  </g>

  <ellipse cx="800" cy="470" rx="660" ry="410" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
