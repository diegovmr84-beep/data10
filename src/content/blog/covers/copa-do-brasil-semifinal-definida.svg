<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- confronto já decidido (Atlético-MG x Cruzeiro): linha sólida e ponto preenchido -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2.5">
    <path d="M 260 250 H 520"/>
    <path d="M 260 380 H 520"/>
    <path d="M 520 250 V 380"/>
    <path d="M 520 315 H 700"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.5">
    <circle cx="248" cy="250" r="9"/>
    <circle cx="248" cy="380" r="9"/>
  </g>
  <circle cx="700" cy="315" r="13" fill="#7686a8" fill-opacity="0.6"/>

  <!-- confronto de hoje (Grêmio x Internacional): linha em destaque, pulsando -->
  <g fill="none" stroke="#e57426" stroke-width="3">
    <path d="M 260 540 H 520"/>
    <path d="M 260 670 H 520"/>
    <path d="M 520 540 V 670"/>
    <path d="M 520 605 H 700"/>
  </g>
  <g fill="#f4f6fa">
    <circle cx="248" cy="540" r="10"/>
    <circle cx="248" cy="670" r="10"/>
  </g>
  <circle cx="700" cy="605" r="16" fill="none" stroke="#e57426" stroke-width="3"/>
  <circle cx="700" cy="605" r="7" fill="#e57426"/>

  <!-- convergência para a semifinal -->
  <path d="M 700 315 V 605" fill="none" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2.5"/>
  <path d="M 700 460 H 980" fill="none" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2.5"/>
  <circle cx="980" cy="460" r="16" fill="none" stroke="#e6eaf3" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="980" cy="460" r="6" fill="#e6eaf3" fill-opacity="0.6"/>

  <ellipse cx="900" cy="450" rx="520" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
