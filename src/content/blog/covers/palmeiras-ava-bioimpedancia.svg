<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- silhueta segmentada do corpo -->
  <g transform="translate(800,450)" fill="none" stroke="#f4f6fa" stroke-opacity="0.7" stroke-width="3" stroke-linejoin="round">
    <circle cx="0" cy="-230" r="34"/>
    <!-- tronco -->
    <path d="M -50 -186 L 50 -186 L 60 -30 L -60 -30 Z"/>
    <!-- bracos -->
    <path d="M -50 -180 L -110 -40 L -90 -20 L -40 -140"/>
    <path d="M 50 -180 L 110 -40 L 90 -20 L 40 -140"/>
    <!-- pernas -->
    <path d="M -60 -30 L -70 190 L -30 190 L -10 -30"/>
    <path d="M 60 -30 L 70 190 L 30 190 L 10 -30"/>
  </g>

  <!-- pontos de contato octapolares -->
  <g fill="#e57426">
    <circle cx="690" cy="410" r="8"/>
    <circle cx="910" cy="410" r="8"/>
    <circle cx="730" cy="640" r="8"/>
    <circle cx="870" cy="640" r="8"/>
  </g>

  <!-- ondas de corrente em duas frequencias -->
  <g fill="none" stroke="#e57426" stroke-opacity="0.5" stroke-width="2">
    <path d="M 690 410 Q 800 380 910 410"/>
    <path d="M 730 640 Q 800 600 870 640"/>
  </g>
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2">
    <path d="M 690 430 q 15 20 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
