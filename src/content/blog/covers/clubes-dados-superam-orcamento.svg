<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7686a8"/>
      <stop offset="100%" stop-color="#e57426"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="760" font-family="Source Serif 4, Georgia, serif" font-size="440" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">92%</text>

  <!-- pilha de barras (orcamento pequeno) -->
  <g fill="#7686a8" fill-opacity="0.55">
    <rect x="220" y="640" width="46" height="70" rx="4"/>
    <rect x="286" y="600" width="46" height="110" rx="4"/>
    <rect x="352" y="560" width="46" height="150" rx="4"/>
  </g>

  <!-- trajetoria ascendente (posicao final) -->
  <path d="M 250 680 C 460 560 620 480 800 400 C 980 320 1130 260 1290 230" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round"/>
  <g fill="#e57426">
    <circle cx="250" cy="680" r="8" fill="#7686a8"/>
    <circle cx="470" cy="558" r="8" fill="#93a1c2"/>
    <circle cx="690" cy="446" r="9" fill="#e57426" fill-opacity="0.7"/>
    <circle cx="900" cy="360" r="10" fill="#e57426" fill-opacity="0.85"/>
    <circle cx="1120" cy="270" r="12"/>
    <circle cx="1290" cy="230" r="20"/>
  </g>

  <!-- selo de categoria -->
  <g transform="translate(90,90)">
    <rect width="220" height="46" rx="23" fill="#e57426"/>
    <text x="110" y="30" font-family="Inter, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">ESTATÍSTICA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
