<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="820" font-family="Source Serif 4, Georgia, serif" font-size="260" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">75%</text>

  <!-- haste central da balanca -->
  <line x1="800" y1="260" x2="800" y2="620" stroke="#7686a8" stroke-opacity="0.5" stroke-width="4"/>
  <circle cx="800" cy="250" r="10" fill="#7686a8" fill-opacity="0.7"/>

  <!-- trave horizontal -->
  <line x1="580" y1="340" x2="1020" y2="340" stroke="#7686a8" stroke-opacity="0.5" stroke-width="4"/>

  <!-- fio esquerdo: icone de jogador -->
  <line x1="580" y1="340" x2="580" y2="430" stroke="#7686a8" stroke-opacity="0.5" stroke-width="2"/>
  <g transform="translate(580,470)">
    <circle r="54" fill="none" stroke="#e57426" stroke-width="4"/>
    <circle cx="0" cy="-16" r="14" fill="#e57426"/>
    <path d="M -24 24 Q 0 -4 24 24" fill="none" stroke="#e57426" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- fio direito: pilha de moedas -->
  <line x1="1020" y1="340" x2="1020" y2="430" stroke="#7686a8" stroke-opacity="0.5" stroke-width="2"/>
  <g fill="none" stroke="#7686a8" stroke-width="4">
    <ellipse cx="1020" cy="500" rx="56" ry="18"/>
    <ellipse cx="1020" cy="470" rx="56" ry="18"/>
    <ellipse cx="1020" cy="440" rx="56" ry="18"/>
  </g>

  <!-- base da balanca -->
  <path d="M 740 620 L 860 620 L 830 660 L 770 660 Z" fill="#7686a8" fill-opacity="0.5"/>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="340" height="46" rx="23" fill="#e57426"/>
    <text x="170" y="30" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">ESTATÍSTICA AVANÇADA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
