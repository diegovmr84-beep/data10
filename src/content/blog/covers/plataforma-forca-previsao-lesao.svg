<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- duas plataformas de forca lado a lado -->
  <g transform="translate(800,560)">
    <rect x="-260" y="-20" width="220" height="40" rx="8" fill="none" stroke="#f4f6fa" stroke-opacity="0.7" stroke-width="3"/>
    <rect x="40" y="-20" width="220" height="40" rx="8" fill="none" stroke="#f4f6fa" stroke-opacity="0.7" stroke-width="3"/>

    <!-- pes estilizados sobre as plataformas -->
    <ellipse cx="-150" cy="-34" rx="46" ry="16" fill="#e6eaf3" fill-opacity="0.18"/>
    <ellipse cx="150" cy="-34" rx="46" ry="16" fill="#e6eaf3" fill-opacity="0.18"/>

    <!-- vetores de forca de reacao do solo, para cima -->
    <g stroke="#e57426" stroke-width="4" stroke-linecap="round">
      <line x1="-150" y1="-40" x2="-150" y2="-190"/>
      <path d="M -164 -172 L -150 -196 L -136 -172"/>
      <line x1="150" y1="-40" x2="150" y2="-240"/>
      <path d="M 164 -222 L 150 -246 L 136 -222"/>
    </g>
  </g>

  <!-- linha do tempo com marcadores, referencia aos 518 testes ao longo da temporada -->
  <g transform="translate(800,700)" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2">
    <line x1="-320" y1="0" x2="320" y2="0"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="740" cy="700" r="4"/>
    <circle cx="820" cy="700" r="4"/>
    <circle cx="900" cy="700" r="4"/>
    <circle cx="980" cy="700" r="4"/>
    <circle cx="1060" cy="700" r="4"/>
    <circle cx="660" cy="700" r="4"/>
    <circle cx="580" cy="700" r="4"/>
    <circle cx="500" cy="700" r="4"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
