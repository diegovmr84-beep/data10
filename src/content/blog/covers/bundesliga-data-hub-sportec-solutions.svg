<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hub central -->
  <circle cx="800" cy="450" r="90" fill="none" stroke="#e57426" stroke-width="4"/>
  <circle cx="800" cy="450" r="46" fill="#e57426" fill-opacity="0.85"/>
  <g stroke="#0b1120" stroke-width="3">
    <line x1="775" y1="450" x2="825" y2="450"/>
    <line x1="800" y1="425" x2="800" y2="475"/>
  </g>

  <!-- feeds saindo para multiplos nos: clubes e midia -->
  <g stroke="#7686a8" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="800" y1="360" x2="800" y2="170"/>
    <line x1="864" y1="386" x2="1080" y2="260"/>
    <line x1="890" y1="450" x2="1160" y2="450"/>
    <line x1="864" y1="514" x2="1080" y2="640"/>
    <line x1="800" y1="540" x2="800" y2="730"/>
    <line x1="736" y1="514" x2="520" y2="640"/>
    <line x1="710" y1="450" x2="440" y2="450"/>
    <line x1="736" y1="386" x2="520" y2="260"/>
  </g>

  <g fill="#f4f6fa" fill-opacity="0.8">
    <circle cx="800" cy="150" r="14"/>
    <circle cx="1100" cy="248" r="14"/>
    <circle cx="1180" cy="450" r="14"/>
    <circle cx="1100" cy="652" r="14"/>
    <circle cx="800" cy="750" r="14"/>
    <circle cx="500" cy="652" r="14"/>
    <circle cx="420" cy="450" r="14"/>
