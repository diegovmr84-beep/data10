<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- ingresso estilizado -->
  <g transform="translate(560,450)">
    <path d="M -160 -100 L 120 -100 a 26 26 0 0 0 0 52 a 26 26 0 0 0 0 96 a 26 26 0 0 0 0 52 L -160 100 Z"
          fill="none" stroke="#7686a8" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="-100" y1="-100" x2="-100" y2="100" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M -40 -30 L 10 -30 L 10 30 L -40 30 Z" fill="none" stroke="#f4f6fa" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- seta de preço subindo -->
  <g transform="translate(760,430)" fill="none" stroke="#e57426" stroke-width="4" stroke-linecap="round">
    <path d="M 0 100 L 40 40 L 80 70 L 140 -40"/>
    <path d="M 108 -40 L 140 -40 L 140 -8"/>
  </g>

  <!-- balança de justiça estilizada -->
  <g transform="translate(1080,420)" fill="none" stroke="#f4f6fa" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="-70" x2="0" y2="90"/>
    <line x1="-90" y1="-40" x2="90" y2="-40"/>
    <path d="M -90 -40 L -120 20 L -60 20 Z"/>
    <path d="M 90 -40 L 60 20 L 120 20 Z"/>
    <line x1="-50" y1="90" x2="50" y2="90"/>
  </g>

  <ellipse cx="800" cy="450" rx="580" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
