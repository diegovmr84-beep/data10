          fill="none" stroke="#e57426" stroke-opacity="0.7" stroke-width="4"/>
    <g stroke="#f4f6fa" stroke-opacity="0.25" stroke-width="2">
      <line x1="-48" y1="-244" x2="48" y2="-244"/>
      <line x1="-48" y1="-172" x2="48" y2="-172"/>
      <line x1="-48" y1="-100" x2="48" y2="-100"/>
      <line x1="-48" y1="-28" x2="48" y2="-28"/>
      <line x1="-48" y1="44" x2="48" y2="44"/>
      <line x1="-48" y1="116" x2="48" y2="116"/>
      <line x1="-48" y1="188" x2="48" y2="188"/>
      <line x1="-48" y1="260" x2="48" y2="260"/>
