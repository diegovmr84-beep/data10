<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- funil: trapezio largo (muitos pontos) estreitando -->
  <path d="M 340 260 L 1260 260 L 950 620 L 650 620 Z" fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="3"/>

  <!-- muitos pontos no topo -->
  <g fill="#7686a8" fill-opacity="0.55">
    <circle cx="400" cy="290" r="6"/><circle cx="460" cy="300" r="6"/><circle cx="520" cy="285" r="6"/>
    <circle cx="580" cy="300" r="6"/><circle cx="640" cy="290" r="6"/><circle cx="700" cy="300" r="6"/>
    <circle cx="760" cy="285" r="6"/><circle cx="820" cy="300" r="6"/><circle cx="880" cy="290" r="6"/>
    <circle cx="940" cy="300" r="6"/><circle cx="1000" cy="285" r="6"/><circle cx="1060" cy="300" r="6"/>
    <circle cx="1120" cy="290" r="6"/><circle cx="1180" cy="300" r="6"/>
    <circle cx="500" cy="360" r="6"/><circle cx="620" cy="370" r="6"/><circle cx="750" cy="360" r="6"/>
    <circle cx="880" cy="370" r="6"/><circle cx="1000" cy="360" r="6"/><circle cx="1100" cy="370" r="6"/>
    <circle cx="620" cy="450" r="6"/><circle cx="750" cy="460" r="6"/><circle cx="900" cy="450" r="6"/>
    <circle cx="1000" cy="460" r="6"/>
    <circle cx="720" cy="540" r="6"/><circle cx="850" cy="540" r="6"/>
  </g>

  <!-- dois pontos em destaque saindo do funil -->
  <circle cx="770" cy="700" r="16" fill="#e57426"/>
  <circle cx="830" cy="760" r="16" fill="#e57426"/>
  <line x1="800" y1="620" x2="770" y2="684" stroke="#e57426" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="800" y1="620" x2="830" y2="744" stroke="#e57426" stroke-opacity="0.6" stroke-width="2"/>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
