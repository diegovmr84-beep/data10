<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- silhueta de cabeça/rosto estilizada, decomposta em pontos -->
  <g transform="translate(800,420)">
    <path d="M -110 -20 Q -110 -160 0 -160 Q 110 -160 110 -20 Q 110 90 60 140 L 40 220 L -40 220 L -60 140 Q -110 90 -110 -20 Z"
          fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2"/>

    <!-- pontos de rastreamento sobre o rosto -->
    <g fill="#e57426" fill-opacity="0.85">
      <circle cx="-45" cy="-60" r="5"/>
      <circle cx="45" cy="-60" r="5"/>
      <circle cx="-55" cy="-10" r="5"/>
      <circle cx="55" cy="-10" r="5"/>
      <circle cx="0" cy="0" r="5"/>
      <circle cx="0" cy="40" r="5"/>
      <circle cx="-35" cy="70" r="5"/>
      <circle cx="35" cy="70" r="5"/>
      <circle cx="-70" cy="-110" r="5"/>
      <circle cx="70" cy="-110" r="5"/>
      <circle cx="0" cy="-140" r="5"/>
    </g>

    <!-- linhas conectando os pontos, como uma malha de pose -->
    <g stroke="#f4f6fa" stroke-opacity="0.3" stroke-width="1.5">
      <line x1="-45" y1="-60" x2="45" y2="-60"/>
      <line x1="-45" y1="-60" x2="-55" y2="-10"/>
      <line x1="45" y1="-60" x2="55" y2="-10"/>
      <line x1="-55" y1="-10" x2="0" y2="0"/>
      <line x1="55" y1="-10" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="40"/>
      <line x1="0" y1="40" x2="-35" y2="70"/>
      <line x1="0" y1="40" x2="35" y2="70"/>
      <line x1="-45" y1="-60" x2="-70" y2="-110"/>
      <line x1="45" y1="-60" x2="70" y2="-110"/>
      <line x1="-70" y1="-110" x2="0" y2="-140"/>
      <line x1="70" y1="-110" x2="0" y2="-140"/>
    </g>
  </g>

  <ellipse cx="800" cy="450" rx="660" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
