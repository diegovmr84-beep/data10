<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- numeral fantasma de fundo -->
  <text x="1560" y="820" font-family="Source Serif 4, Georgia, serif" font-size="260" font-weight="700" fill="#f4f6fa" fill-opacity="0.05" text-anchor="end">2x1</text>

  <!-- linha do tempo central -->
  <line x1="480" y1="470" x2="1150" y2="470" stroke="#7686a8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- trajetoria 1: time que foi forcado, linha continua direto ao alvo -->
  <path d="M 500 330 L 1120 470" fill="none" stroke="#e57426" stroke-width="4"/>
  <circle cx="500" cy="330" r="12" fill="#e57426"/>
  <circle cx="1120" cy="470" r="20" fill="#e57426"/>

  <!-- trajetoria 2: time que rodou, linha quebrada passando por um desvio (banco) -->
  <path d="M 500 610 L 760 610 L 820 540 L 1120 500" fill="none" stroke="#7686a8" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="500" cy="610" r="12" fill="#7686a8"/>
  <circle cx="760" cy="610" r="8" fill="#7686a8" fill-opacity="0.6"/>
  <circle cx="1120" cy="500" r="16" fill="#7686a8"/>

  <!-- selo de categoria (zona segura x:220-1380 y:130-770) -->
  <g transform="translate(250,160)">
    <rect width="280" height="46" rx="23" fill="#e57426"/>
    <text x="140" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0b1120" text-anchor="middle">GESTÃO ESPORTIVA</text>
  </g>

  <ellipse cx="800" cy="450" rx="700" ry="440" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
