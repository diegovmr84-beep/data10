<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- lua crescente, referencia ao sono -->
  <path d="M 520 260 a 130 130 0 1 0 40 250 a 170 170 0 0 1 -40 -250 Z" fill="#e6eaf3" fill-opacity="0.12"/>

  <!-- pulso com anel/pulseira inteligente -->
  <g transform="translate(950,500)" fill="none" stroke="#f4f6fa" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round">
    <path d="M -70 40 Q -90 -40 -30 -90 Q 30 -130 90 -80 Q 130 -40 100 30 Q 80 90 10 100 Q -50 105 -70 40 Z"/>
  </g>
  <ellipse cx="985" cy="440" rx="26" ry="16" fill="none" stroke="#e57426" stroke-width="5" transform="rotate(-18 985 440)"/>

  <!-- onda de sono saindo do anel -->
  <g fill="none" stroke="#e57426" stroke-opacity="0.6" stroke-width="3">
    <path d="M 1030 430 l 40 0 l 15 -30 l 20 60 l 15 -40 l 20 20 l 40 0"/>
  </g>

  <!-- estrelas -->
  <g fill="#e6eaf3" fill-opacity="0.5">
    <circle cx="420" cy="220" r="4"/>
    <circle cx="480" cy="340" r="3"/>
    <circle cx="380" cy="420" r="3"/>
    <circle cx="600" cy="200" r="3"/>
  </g>

  <ellipse cx="800" cy="450" rx="600" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
