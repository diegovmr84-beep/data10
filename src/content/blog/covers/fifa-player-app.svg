<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- silhueta de smartphone estilizado -->
  <g transform="translate(700,180)">
    <rect x="0" y="0" width="200" height="400" rx="24" fill="none" stroke="#7686a8" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="70" y1="24" x2="130" y2="24" stroke="#7686a8" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>

    <!-- mapa de calor simplificado dentro da tela -->
    <circle cx="70" cy="150" r="26" fill="#e57426" fill-opacity="0.5"/>
    <circle cx="130" cy="200" r="34" fill="#e57426" fill-opacity="0.35"/>
    <circle cx="90" cy="260" r="20" fill="#e57426" fill-opacity="0.45"/>

    <!-- linhas representando dados físicos (velocidade/distância) -->
    <path d="M 20 330 L 60 300 L 100 320 L 140 280 L 180 300" fill="none" stroke="#f4f6fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- conexão simbólica jogador -> dados -->
  <g fill="none" stroke="#e6eaf3" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2 10">
    <path d="M 700 380 C 550 420, 480 500, 480 600"/>
    <path d="M 900 380 C 1050 420, 1120 500, 1120 600"/>
  </g>
  <circle cx="480" cy="620" r="14" fill="#f4f6fa"/>
  <circle cx="1120" cy="620" r="14" fill="#f4f6fa"/>

  <ellipse cx="800" cy="450" rx="560" ry="420" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
